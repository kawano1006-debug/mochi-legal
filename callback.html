<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mochi Uploader - Auth Callback</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#faf9f7;color:#2a2420;padding:40px;line-height:1.6;}
.card{max-width:600px;margin:0 auto;background:#fff;border:1px solid #e8e2da;border-radius:14px;padding:32px;}
h1{font-size:1.3rem;}
code{background:#f0ece6;padding:2px 6px;border-radius:4px;word-break:break-all;display:inline-block;margin-top:8px;}
.copy{margin-top:16px;padding:10px 16px;background:#c97b5a;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.95rem;}
.copy:active{opacity:.8;}
#status{margin-top:12px;color:#6b625a;font-size:.9rem;}
</style>
</head>
<body>
<div class="card">
<h1>TikTok Authorization Callback</h1>
<p>Authorization code received. Copy it and paste it into the upload script.</p>
<p><strong>code:</strong><br><code id="code"></code></p>
<p><strong>state:</strong><br><code id="state"></code></p>
<button class="copy" onclick="copyCode()">Copy code</button>
<div id="status"></div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
document.getElementById('code').textContent = params.get('code') || '(none)';
document.getElementById('state').textContent = params.get('state') || '(none)';
function copyCode(){
  const code = params.get('code') || '';
  navigator.clipboard.writeText(code).then(() => {
    document.getElementById('status').textContent = 'Copied to clipboard.';
  });
}
</script>
</body>
</html>
